<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 660" role="img" aria-label="Herbedia Beard Care in an amber glass dropper bottle">
<defs>
<linearGradient id="og" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#3A1704"/><stop offset=".12" stop-color="#7E3A0C"/>
  <stop offset=".33" stop-color="#C0731F"/><stop offset=".5" stop-color="#E2A551"/>
  <stop offset=".66" stop-color="#AE5F16"/><stop offset=".87" stop-color="#642C08"/>
  <stop offset="1" stop-color="#2E1103"/>
</linearGradient>
<linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#06170F"/><stop offset=".2" stop-color="#173D2C"/>
  <stop offset=".46" stop-color="#2A5F45"/><stop offset=".72" stop-color="#12362A"/>
  <stop offset="1" stop-color="#050F0A"/>
</linearGradient>
<linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#6E5426"/><stop offset=".22" stop-color="#C9A961"/>
  <stop offset=".45" stop-color="#F0E0B6"/><stop offset=".7" stop-color="#B4924F"/>
  <stop offset="1" stop-color="#6B5124"/>
</linearGradient>
<linearGradient id="lbl" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#E4DBC7"/><stop offset=".2" stop-color="#FBF7EC"/>
  <stop offset=".72" stop-color="#F4EEE0"/><stop offset="1" stop-color="#D9CFB8"/>
</linearGradient>
<linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="shdw" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#08201A" stop-opacity=".42"/><stop offset="1" stop-color="#08201A" stop-opacity="0"/>
</radialGradient>
</defs>

<ellipse cx="200" cy="628" rx="118" ry="20" fill="url(#shdw)"/>

<!-- dropper bulb -->
<path d="M180 10h40c6 0 10 5 10 11v32c0 6-4 11-10 11h-40c-6 0-10-5-10-11V21c0-6 4-11 10-11z" fill="url(#cap)"/>
<rect x="184" y="16" width="8" height="34" rx="4" fill="#fff" opacity=".14"/>
<rect x="176" y="60" width="48" height="8" rx="3" fill="url(#brass)"/>
<!-- cap -->
<rect x="158" y="68" width="84" height="76" rx="7" fill="url(#cap)"/>
<g opacity=".3" stroke="#000" stroke-width="1.4">
  <path d="M168 76v60M180 76v60M192 76v60M204 76v60M216 76v60M228 76v60"/>
</g>
<rect x="158" y="126" width="84" height="12" fill="url(#brass)"/>
<rect x="163" y="72" width="9" height="60" rx="4" fill="#fff" opacity=".16"/>
<!-- neck -->
<rect x="170" y="144" width="60" height="34" fill="url(#og)"/>
<rect x="164" y="170" width="72" height="16" rx="6" fill="url(#og)"/>

<!-- body -->
<path d="M120 214c0-18 12-32 30-36l14-3h72l14 3c18 4 30 18 30 36v308c0 24-19 43-43 43H163c-24 0-43-19-43-43V214z" fill="url(#og)"/>
<path d="M120 214c0-18 12-32 30-36l14-3h72l14 3c18 4 30 18 30 36v308c0 24-19 43-43 43H163c-24 0-43-19-43-43V214z" fill="none" stroke="#2E1204" stroke-opacity=".45" stroke-width="2"/>
<!-- glass highlights -->
<rect x="137" y="196" width="16" height="340" rx="8" fill="url(#glare)" opacity=".55"/>
<rect x="163" y="200" width="6" height="300" rx="3" fill="#fff" opacity=".28"/>
<rect x="252" y="216" width="9" height="300" rx="5" fill="#fff" opacity=".13"/>

<!-- label -->
<rect x="132" y="262" width="136" height="212" rx="5" fill="url(#lbl)"/>
<rect x="132" y="262" width="136" height="212" rx="5" fill="none" stroke="#C9BFA6" stroke-width="1"/>
<rect x="140" y="270" width="120" height="196" rx="2" fill="none" stroke="#B4924F" stroke-width=".9" stroke-opacity=".65"/>
<g fill="#12382B" font-family="Newsreader,Georgia,serif" text-anchor="middle">
  <text x="200" y="304" font-size="16" letter-spacing="4.2">HERBEDIA</text>
</g>
<path d="M164 313h72" stroke="#B4924F" stroke-width=".9"/>
<g fill="#9A7B3A" font-family="'JetBrains Mono',monospace" text-anchor="middle">
  <text x="200" y="330" font-size="6.4" letter-spacing="2.4">HAIR &amp; SCALP</text>
</g>
<g fill="#14231C" font-family="Newsreader,Georgia,serif" text-anchor="middle">
  <text x="200" y="362" font-size="20">Beard Care</text>
  <text x="200" y="386" font-size="11" font-style="italic" fill="#4D5F55">Botanical Oil</text>
</g>
<!-- botanical mark -->
<g transform="translate(200 414)" stroke="#4F7355" stroke-width="1.3" fill="none" stroke-linecap="round">
  <path d="M0 20V-8"/>
  <path d="M0 4c-11 0-17-6-17-14 9 0 17 6 17 14zM0 4c11 0 17-6 17-14-9 0-17 6-17 14z"/>
  <path d="M0-6c-8 0-13-5-13-11 7 0 13 5 13 11zM0-6c8 0 13-5 13-11-7 0-13 5-13 11z"/>
</g>
<path d="M164 440h72" stroke="#B4924F" stroke-width=".9" stroke-opacity=".6"/>
<g fill="#6F8076" font-family="'JetBrains Mono',monospace" text-anchor="middle">
  <text x="200" y="456" font-size="6" letter-spacing="2.2">NATURE IS CURE</text>
</g>

<!-- base sheen -->
<path d="M139 536h122c-4 14-16 22-32 22h-58c-16 0-28-8-32-22z" fill="#3A1806" opacity=".3"/>
</svg>
