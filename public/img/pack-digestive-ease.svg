  <ellipse cx="230" cy="500" rx="132" ry="26" fill="none" stroke="#749567" stroke-opacity=".22" stroke-width="1.5"/>
</g>
<!-- zipper track -->
<rect x="122" y="132" width="216" height="7" rx="3.5" fill="#1B0C4A"/>
<rect x="122" y="133" width="216" height="2" rx="1" fill="#749567" opacity=".45"/>

<!-- label lockup -->
<rect x="132" y="176" width="196" height="292" rx="4" fill="none" stroke="url(#foil)" stroke-width="1.2" opacity=".85"/>
<g text-anchor="middle">
