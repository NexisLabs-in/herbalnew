  <stop offset=".44" stop-color="#DDD5F8"/><stop offset=".68" stop-color="#512BC7"/>
  <stop offset="1" stop-color="#2E1364"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".14"/>
  <stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<radialGradient id="shdw2" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#120833" stop-opacity=".4"/><stop offset="1" stop-color="#120833" stop-opacity="0"/>
</radialGradient>
<clipPath id="pouchClip">
  <path d="M112 118c0-4 3-7 7-7h222c4 0 7 3 7 7l14 388c1 30-32 48-132 48S97 536 98 506l14-388z"/>
</clipPath>
</defs>

<ellipse cx="230" cy="576" rx="142" ry="20" fill="url(#shdw2)"/>

<!-- crimped top seal -->
<path d="M118 62h224c5 0 9 4 9 9v40c0 5-4 9-9 9H118c-5 0-9-4-9-9V71c0-5 4-9 9-9z" fill="url(#seal)"/>
<g stroke="#749567" stroke-width="1" opacity=".4">
  <path d="M120 68v46M130 68v46M140 68v46M150 68v46M160 68v46M170 68v46M180 68v46M190 68v46M200 68v46M210 68v46M220 68v46M230 68v46M240 68v46M250 68v46M260 68v46M270 68v46M280 68v46M290 68v46M300 68v46M310 68v46M320 68v46M330 68v46M340 68v46"/>
</g>
<path d="M109 96l13 8-13 8z" fill="#0A0320"/>
<path d="M351 96l-13 8 13 8z" fill="#0A0320"/>

<!-- pouch body -->
<path d="M112 118c0-4 3-7 7-7h222c4 0 7 3 7 7l14 388c1 30-32 48-132 48S97 536 98 506l14-388z" fill="url(#pg)"/>
<g clip-path="url(#pouchClip)">
