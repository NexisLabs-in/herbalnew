<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 660" role="img" aria-label="Herbedia Digestive Ease herbal blend in a matte deep-green stand-up pouch">
<defs>
<linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#120833"/><stop offset=".07" stop-color="#1F0E55"/>
  <stop offset=".26" stop-color="#34168A"/><stop offset=".42" stop-color="#4927B7"/>
  <stop offset=".55" stop-color="#3A1B95"/><stop offset=".78" stop-color="#241062"/>
  <stop offset=".93" stop-color="#170B42"/><stop offset="1" stop-color="#0A0320"/>
</linearGradient>
<linearGradient id="seal" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#150A3C"/><stop offset=".28" stop-color="#2E1364"/>
  <stop offset=".5" stop-color="#3A1B95"/><stop offset=".76" stop-color="#26105F"/>
  <stop offset="1" stop-color="#0E0628"/>
</linearGradient>
<linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
