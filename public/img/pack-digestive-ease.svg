  <text x="230" y="251" font-family="'JetBrains Mono',monospace" font-size="6.6" letter-spacing="2.6" fill="#C9A961">DIGESTION</text>
  <text x="230" y="303" font-size="29" fill="#FDFBF6">Digestive</text><text x="230" y="338" font-size="29" fill="#FDFBF6">Ease</text>
  <text x="230" y="365" font-family="Newsreader,Georgia,serif" font-size="12" font-style="italic" fill="#DFC98F">Herbal Infusion Blend</text>
</g>
<g transform="translate(230 412)">
  <circle r="33" fill="none" stroke="url(#foil)" stroke-width="1" opacity=".75"/>
  <circle r="27" fill="none" stroke="#7B5FE0" stroke-width=".6" opacity=".38"/>
  <g stroke="#B3A4EE" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M0 17V-14"/>
    <path d="M0 7c-11 0-17-6-17-14 10 0 17 6 17 14zM0 7c11 0 17-6 17-14-10 0-17 6-17 14z"/>
    <path d="M0-5c-8 0-12-5-12-11 7 0 12 5 12 11zM0-5c8 0 12-5 12-11-7 0-12 5-12 11z"/>
  </g>
</g>
<g text-anchor="middle">
  <path d="M180 450h100" stroke="url(#foil)" stroke-width=".8" opacity=".55"/>
  <text x="230" y="464" font-family="'JetBrains Mono',monospace" font-size="6" letter-spacing="2.2" fill="#A6C199">NATURE IS CURE</text>
